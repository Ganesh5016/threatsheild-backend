version: "3.9"

# ============================================================
# THREATSHIELD — Docker Compose (Full Stack)
# Starts: FastAPI backend + PostgreSQL + Redis
# ============================================================

services:

  # ── FastAPI Backend ──────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: threatshield-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=development
      - DEBUG=true
      - DATABASE_URL=postgresql+asyncpg://ts_user:ts_pass@postgres:5432/threatshield
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=change-this-in-production-at-least-32-chars
      - ALLOWED_ORIGINS=http://localhost:5173,http://localhost:4173
      # Add your API keys here or use .env file:
      # - VIRUSTOTAL_API_KEY=your_key
      # - GOOGLE_SAFE_BROWSING_API_KEY=your_key
      # - URLSCAN_API_KEY=your_key
    env_file:
      - .env
    volumes:
      - ./uploads:/app/uploads
      - ./app/core/yara_rules:/app/app/core/yara_rules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - threatshield-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout:  10s
      retries:  3

  # ── PostgreSQL Database ──────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: threatshield-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB:       threatshield
      POSTGRES_USER:     ts_user
      POSTGRES_PASSWORD: ts_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - threatshield-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ts_user -d threatshield"]
      interval: 10s
      timeout:  5s
      retries:  5

  # ── Redis Cache ──────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: threatshield-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - threatshield-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout:  5s
      retries:  5
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru

  # ── Frontend (Vite dev server) ───────────────────────────
  frontend:
    image: node:20-alpine
    container_name: threatshield-frontend
    working_dir: /app
    ports:
      - "5173:5173"
    volumes:
      - ../threatshield-full:/app   # adjust path to your frontend folder
    command: sh -c "npm install && npm run dev -- --host"
    networks:
      - threatshield-net
    depends_on:
      - api

volumes:
  postgres_data:
  redis_data:

networks:
  threatshield-net:
    driver: bridge
